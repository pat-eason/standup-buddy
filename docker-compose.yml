name: standup-buddy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: standup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standup}
      POSTGRES_DB: standup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standup -d standup"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://standup:${POSTGRES_PASSWORD:-standup}@db:5432/standup?sslmode=disable
      AGENT_URL: http://agent:3000
      APP_SECRET: ${APP_SECRET:-dev-only-secret-change-me}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Match your browser's time zone so the MCP server's "today" agrees with the UI, e.g. America/New_York.
      TZ: ${TZ:-UTC}
      # Optional bearer token for MCP clients at /mcp. Empty = open (the app is bound to localhost).
      MCP_TOKEN: ${MCP_TOKEN:-}
      PORT: "8080"

  agent:
    build: ./agent
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://standup:${POSTGRES_PASSWORD:-standup}@db:5432/standup?sslmode=disable
      API_URL: http://api:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      PORT: "3000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      # Single-user app with no login: bound to localhost on purpose.
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  pgdata:
