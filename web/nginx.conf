server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve upstreams through Docker's DNS so a recreated api/agent container is picked up.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:8080;
  set $agent_upstream http://agent:3000;

  # Go API. Collate/finalize wait on an LLM, so allow long responses.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
  }

  # Flue notes assistant, consumed by @flue/react (SSE): no buffering.
  location /agents/ {
    proxy_pass $agent_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
